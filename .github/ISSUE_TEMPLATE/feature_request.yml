name: Feature request
description: Suggest an improvement to Vextris
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Thanks for the idea. Focus on the player problem and the expected result."
  - type: textarea
    id: problem
    attributes:
      label: What player problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
